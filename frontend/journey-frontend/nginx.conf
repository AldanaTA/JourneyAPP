server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite puts a content hash in every file name under /assets/, so they can be cached for good.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Never cache the page itself, so a new deploy is picked up on the next visit.
    location = /index.html {
        expires -1;
    }

    # Client-side routes (/campaigns/..., /join/<code>, ...) all load the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
