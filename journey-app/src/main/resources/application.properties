spring.application.name=api-rest-v1

spring.datasource.url=${DB_URL:jdbc:postgresql://192.168.40.105:1090/journey_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

journey.agent.base-url=${AGENT_SERVICE_URL:http://192.168.40.105:8800}

spring.show-actuator=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Lets string parameters bind to Postgres enum columns (trait_category, power_category, size).
spring.datasource.hikari.data-source-properties.stringtype=unspecified

# Where stored images (assets) live; the rules importer writes to the same directory.
journey.assets.dir=${ASSET_STORAGE_DIR:/data/assets}

# Sign-in. JWT_SECRET must be at least 32 bytes and shared with every service that verifies tokens.
journey.auth.jwt-secret=${JWT_SECRET:}
journey.auth.issuer=journey-api
journey.auth.access-token-minutes=15
journey.auth.refresh-token-days=30
# Set AUTH_COOKIE_SECURE=true anywhere that is served over HTTPS (everywhere but localhost).
journey.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}

# Errors raised on purpose (404 "Asset not found", 401 "Wrong username or password", ...) are returned as
# RFC 9457 problem details with their message in "detail"; unexpected errors still only say what failed.
spring.mvc.problemdetails.enabled=true

# Outgoing email (password reset links). Leave MAIL_HOST empty to disable sending (a warning is logged).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
journey.mail.from=${MAIL_FROM:Journey <no-reply@localhost>}
# Where the frontend is served; reset links point to <APP_BASE_URL>/reset-password?token=...
journey.mail.app-base-url=${APP_BASE_URL:http://localhost:5173}

# Per-IP request limits (see RateLimitFilter). Set RATE_LIMIT_ENABLED=false only for load tests.
journey.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# Email is optional: a missing or unreachable mail server must not mark the API unhealthy.
management.health.mail.enabled=false
