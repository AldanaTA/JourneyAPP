services:
  api-layer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: journey-api
    restart: unless-stopped
    # This folder's .env when run on its own; optional, since the root compose passes everything below.
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://localhost:1090/journey}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      AGENT_SERVICE_URL: ${AGENT_SERVICE_URL:-http://localhost:8800}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      ASSET_STORAGE_DIR: /data/assets
      # Email goes to the Mailpit test server below unless .env names a real SMTP server.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Journey <no-reply@localhost>}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # Read the client IP from X-Forwarded-For when the request comes through a proxy on a private
      # address (Caddy), so rate limits are per visitor instead of one shared limit for everyone.
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-native}
    volumes:
      # Images written by the rules importer (agent-services mounts the same folder read-write).
      - ${ASSET_STORAGE_HOST_DIR:-../data/assets}:/data/assets:ro
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: journey-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
