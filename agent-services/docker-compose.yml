services:
  journey-agents:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/agents
      # Image files for rules (and later other content). The Spring API mounts the same host folder to
      # serve them, so both containers see the same files.
      - ${ASSET_STORAGE_HOST_DIR:-../data/assets}:/data/assets
    container_name: journey-agents
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASSET_STORAGE_DIR: /data/assets
    ports:
      - "${AGENT_PORT}:8800"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8800/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10  